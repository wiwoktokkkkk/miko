name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test & build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.5"
          cache: true

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          MIKO_SIGNING_KEY_BASE64: ${{ secrets.MIKO_SIGNING_KEY_BASE64 }}
          MIKO_STORE_PASSWORD: ${{ secrets.MIKO_STORE_PASSWORD }}
          MIKO_KEY_PASSWORD: ${{ secrets.MIKO_KEY_PASSWORD }}
          MIKO_KEY_ALIAS: ${{ secrets.MIKO_KEY_ALIAS }}
        run: |
          printf '%s' "$MIKO_SIGNING_KEY_BASE64" | base64 --decode > android/app/miko-release.jks
          cat > android/key.properties <<EOF
          storePassword=$MIKO_STORE_PASSWORD
          keyPassword=$MIKO_KEY_PASSWORD
          keyAlias=$MIKO_KEY_ALIAS
          storeFile=miko-release.jks
          EOF

      - name: Build release APK
        run: >-
          flutter build apk --release
          --target-platform android-arm64
          --obfuscate
          --split-debug-info=build/symbols

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: miko-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Miko (build latest)
          body: Build otomatis APK release dari branch main.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
